<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MyPA">
  <rect width="64" height="64" rx="8" fill="#0B0F14"/>
  <!-- Cyber monogram: [•] — open bracket + coral seal + close bracket
       Reads as a file-open indicator, a prompt cursor, and a seal at once. -->
  <text x="9" y="44" font-family="ui-monospace, 'JetBrains Mono', monospace"
        font-size="38" font-weight="700" fill="#7CC4FF">[</text>
  <circle cx="32" cy="32" r="7" fill="#FF6B5B"/>
  <text x="38" y="44" font-family="ui-monospace, 'JetBrains Mono', monospace"
        font-size="38" font-weight="700" fill="#7CC4FF">]</text>
</svg>
