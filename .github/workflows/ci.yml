name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system packages
        # libsqlcipher-dev is needed by sqlcipher3-binary on Linux. We're
        # actually using TEST_NO_ENCRYPTION=true in tests so plain SQLite
        # is enough, but the dep tree still imports sqlcipher3 — install
        # the headers just in case.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.110" "uvicorn[standard]>=0.27" "mcp>=1.27" \
            "sqlalchemy>=2" "pydantic>=2.5" "pydantic-settings>=2" \
            "httpx>=0.27" "pyjwt[crypto]>=2.8" "slowapi" \
            "apscheduler>=3.10" "pytest>=8" "python-multipart>=0.0.9"
          # sqlcipher3-binary doesn't ship a Linux wheel for 3.12 reliably;
          # plain SQLite is used in tests via TEST_NO_ENCRYPTION=true,
          # so we don't install it.

      - name: Run tests
        env:
          TEST_NO_ENCRYPTION: 'true'
          NTFY_USER_MGMT_ENABLED: 'false'
          BEARER_TOKEN_RW: 'test-rw-token'
          BEARER_TOKEN_RO: 'test-ro-token'
          OAUTH_JWT_SECRET: 'ci-only-jwt-secret-not-for-prod'
        run: |
          PYTHONPATH=. pytest -q tests/
